<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1035" viewBox="0 0 1920 1035" style="font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="1920" height="1035" fill="#0a101c"/><text x="30" y="48" fill="#e8edf7" font-size="30" font-weight="750" text-anchor="start" >Chrona · Bus 采样 bit 错位提示</text><text x="30" y="78" fill="#92a1b7" font-size="15" font-weight="400" text-anchor="start" >四个可选的视觉方向 · 仅为设计稿，尚未更改产品界面</text><text x="30" y="1003" fill="#92a1b7" font-size="14" font-weight="400" text-anchor="start" >统一语义：黄色表示潜在 bit 错位；红色继续表示直接 Setup / Hold 违例。</text><g transform="translate(30 105)"><rect width="900" height="420" rx="18" fill="#0e1523"/><text x="26" y="37" fill="#e8edf7" font-size="22" font-weight="750" text-anchor="start" >A  结果下沿标注</text><rect x="647" y="17" width="226" height="28" rx="14" fill="#26334a"/><text x="760" y="36" fill="#bbcbdf" font-size="12" font-weight="650" text-anchor="middle" >最接近当前实现</text><text x="28" y="65" fill="#92a1b7" font-size="12" font-weight="400" text-anchor="start" >低干扰，直接覆盖受影响的整段 Q；需保留清楚的文字说明。</text><rect x="22" y="78" width="856" height="270" rx="12" fill="#101827" stroke="#2b384a"/><line x1="265" x2="265" y1="104" y2="324" stroke="#2b384a" stroke-dasharray="3 5"/><text x="265" y="105" fill="#92a1b7" font-size="11" font-weight="500" text-anchor="middle" >0.8 ns</text><line x1="432" x2="432" y1="104" y2="324" stroke="#2b384a" stroke-dasharray="3 5"/><text x="432" y="105" fill="#92a1b7" font-size="11" font-weight="500" text-anchor="middle" >1.0 ns</text><line x1="599" x2="599" y1="104" y2="324" stroke="#2b384a" stroke-dasharray="3 5"/><text x="599" y="105" fill="#92a1b7" font-size="11" font-weight="500" text-anchor="middle" >1.2 ns</text><line x1="766" x2="766" y1="104" y2="324" stroke="#2b384a" stroke-dasharray="3 5"/><text x="766" y="105" fill="#92a1b7" font-size="11" font-weight="500" text-anchor="middle" >1.4 ns</text><text x="45" y="160" fill="#e8edf7" font-size="13" font-weight="600"